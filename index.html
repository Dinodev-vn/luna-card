<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUHY</title>

    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* .card-container {
        width: 300px;
        height: 500px;
        perspective: 1200px;
        cursor: pointer;
      } */

      .card-container {
        width: 80vw;
        max-width: 300px;
        aspect-ratio: 3 / 5;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateY(0deg);
        transition: transform 0.8s ease-in-out;
      }

      .card.spin {
        animation: spinCard 4s linear infinite;
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 16px;
        overflow: hidden;
      }

      .card-face img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-front {
        transform: rotateY(0deg);
      }
      .card-back {
        transform: rotateY(180deg);
      }

      @keyframes spinCard {
        from {
          transform: rotateY(180deg);
        }
        to {
          transform: rotateY(540deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="card-container" onclick="revealCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <img src="1.png" />
        </div>

        <div class="card-face card-back">
          <img id="frontImg" src="2.png" />
        </div>
      </div>
    </div>

    <audio id="music" src="music.mp3"></audio>

    <script>
      let triggered = false;

      // Danh sách ảnh để đổi
      const images = ["2.png", "3.png"];

      let index = 0;

      function revealCard() {
        if (triggered) return;
        triggered = true;

        const card = document.getElementById("card");
        const music = document.getElementById("music");

        music.play().catch(() => {});

        // Lật
        card.style.transform = "rotateY(180deg)";

        // Sau 3s → spin + bắt đầu đổi ảnh
        setTimeout(() => {
          card.classList.add("spin");
          startChangingImages();
        }, 2400);
      }

      function startChangingImages() {
        const img = document.getElementById("frontImg");

        function changeImage() {
          index = (index + 1) % images.length;
          img.src = images[index];
        }

        // 👉 Lần đầu: chạy sau nửa vòng (2s)
        setTimeout(() => {
          changeImage();

          // 👉 Sau đó mới lặp đều
          setInterval(() => {
            changeImage();
          }, 4000);
        }, 2000);
      }
    </script>
  </body>
</html>

<style>
  body {
    background-image: url("bg4.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
  }
</style>

<script>
  const audio = document.getElementById("music");
  audio.volume = 0.1;
</script>
