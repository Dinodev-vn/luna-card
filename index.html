<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUHY</title>

    <style>
      body {
        margin: 0;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* .card-container {
        width: 300px;
        height: 500px;
        perspective: 1200px;
        cursor: pointer;
      } */

      .card-container {
        width: 80vw;
        max-width: 300px;
        aspect-ratio: 3 / 5;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateY(0deg);
        transition: transform 0.8s ease-in-out;
      }

      .card.spin {
        animation: spinCard 4s linear infinite;
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 16px;
        overflow: hidden;
      }

      .card-face img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-front {
        transform: rotateY(0deg);
      }
      .card-back {
        transform: rotateY(180deg);
      }

      @keyframes spinCard {
        from {
          transform: rotateY(180deg);
        }
        to {
          transform: rotateY(540deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="rain"></div>
    <img src="black-bg.png" class="full-imgg" />
    <img src="done.jpg" class="ghost-img full-img" />
    <div class="card-container" onclick="revealCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <img src="1.png" />
        </div>

        <div class="card-face card-back">
          <img id="frontImg" src="2.png" />
        </div>
      </div>
    </div>

    <audio id="music" src="music.mp3"></audio>

    <script>
      let triggered = false;

      // Danh sách ảnh để đổi
      const images = ["2.png", "3.png"];

      let index = 0;

      function revealCard() {
        if (triggered) return;
        triggered = true;

        const card = document.getElementById("card");
        const music = document.getElementById("music");

        music.play().catch(() => {});

        // Lật
        card.style.transform = "rotateY(180deg)";

        // Sau 3s → spin + bắt đầu đổi ảnh
        setTimeout(() => {
          card.classList.add("spin");
          startChangingImages();
        }, 2400);
      }

      function startChangingImages() {
        const img = document.getElementById("frontImg");

        function changeImage() {
          index = (index + 1) % images.length;
          img.src = images[index];
        }

        // 👉 Lần đầu: chạy sau nửa vòng (2s)
        setTimeout(() => {
          changeImage();

          // 👉 Sau đó mới lặp đều
          setInterval(() => {
            changeImage();
          }, 4000);
        }, 2000);
      }
    </script>
  </body>
</html>

<style>
  .full-imgg {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover; /* giống background-size: cover */
    object-position: center; /* giống background-position */

    z-index: -1; /* nằm dưới tất cả */
  }
</style>

<script>
  const audio = document.getElementById("music");
  audio.volume = 0.1;
</script>

<style>
  /* Ẩn ban đầu */
  .card-container {
    opacity: 0;
    transition: opacity 1s ease;
  }

  .full-img {
    opacity: 0;
    transition:
      opacity 1s ease,
      transform 0.2s linear;
  }

  /* Hiện dần */
  .show {
    opacity: 1;
  }

  .spin-img {
    animation: spinFast 0.5s linear infinite;
  }

  @keyframes spinFast {
    from {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
</style>

<script>
  window.addEventListener("load", () => {
    const cardContainer = document.querySelector(".card-container");
    const bgImg = document.querySelector(".full-img");

    // Sau 3s → hiện card
    setTimeout(() => {
      cardContainer.classList.add("show");

      // Sau khi card hiện xong (1s) → hiện background
      setTimeout(() => {
        bgImg.classList.add("show");
      }, 1000);
    }, 3000);
  });
  function revealCard() {
    if (triggered) return;
    triggered = true;

    const card = document.getElementById("card");
    const music = document.getElementById("music");
    const bgImg = document.querySelector(".full-img");

    music.play().catch(() => {});

    // Lật card
    card.style.transform = "rotateY(180deg)";

    // 👉 Kích hoạt xoay nền (tăng tốc dần)
    let speed = 1; // giây
    let interval;

    function startSpin() {
      interval = setInterval(() => {
        speed -= 0.1;
        if (speed <= 0.1) {
          clearInterval(interval);
          bgImg.classList.add("spin-img"); // tốc độ max
          return;
        }
        bgImg.style.animation = `spinFast ${speed}s linear infinite`;
      }, 200);
    }

    startSpin();

    // Sau 2.4s → card spin + đổi ảnh
    setTimeout(() => {
      card.classList.add("spin");
      startChangingImages();
    }, 2400);
  }
</script>

<style>
  .ghost-img {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    max-width: 100vw;
    max-height: 100vh;

    width: auto;
    height: auto;

    z-index: -1;
    pointer-events: none;
    image-rendering: auto;
  }
</style>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  .rain {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .drop {
    position: absolute;
    width: 3px;
    height: 10px;
    background: linear-gradient(180deg, #ffd700, #fff5cc);
    border-radius: 50%;
    opacity: 0.8;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10px) scale(0.5);
      opacity: 0;
    }
    30% {
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) scale(1);
      opacity: 0;
    }
  }
  .drop {
    box-shadow:
      0 0 6px #ffd700,
      0 0 12px #ffec8b;
  }
</style>

<script>
  const rain = document.querySelector(".rain");

  function createDrop() {
    const drop = document.createElement("div");
    drop.classList.add("drop");

    drop.style.left = Math.random() * window.innerWidth + "px";
    drop.style.animationDuration = Math.random() * 3 + 2 + "s";
    drop.style.opacity = Math.random();

    rain.appendChild(drop);

    setTimeout(() => {
      drop.remove();
    }, 5000);
  }

  setInterval(createDrop, 50);

  const size = Math.random() * 4 + 2;
  drop.style.width = size + "px";
  drop.style.height = size * 3 + "px";
</script>
